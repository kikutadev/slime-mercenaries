<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plain Slime — Rive Motion Reference</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 18%, #ffffff 0, #f3fbff 36%, #e8f4fb 100%); color: #183452; }
    main { width: min(980px, 100%); padding: 28px; display: grid; grid-template-columns: minmax(300px, 1fr) minmax(280px, 360px); gap: 28px; align-items: center; }
    .stage { min-height: 620px; border-radius: 36px; display: grid; place-items: center; background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(235,248,255,.86)); box-shadow: 0 24px 80px rgba(37, 103, 144, .14), inset 0 0 0 1px rgba(50, 119, 161, .08); overflow: hidden; }
    .mount { width: min(92%, 560px); aspect-ratio: 1; display: grid; place-items: center; }
    .mount svg { width: 100%; height: 100%; overflow: visible; }
    .panel { padding: 8px 0; }
    h1 { font-size: clamp(28px, 4vw, 44px); margin: 0 0 10px; letter-spacing: -.035em; }
    .lede { margin: 0 0 24px; line-height: 1.7; color: #52708d; }
    .controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    button { appearance: none; border: 1px solid rgba(37, 111, 154, .14); background: rgba(255,255,255,.86); color: #204866; border-radius: 15px; min-height: 48px; padding: 10px 14px; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 7px 22px rgba(41, 116, 157, .08); transition: transform .12s ease, box-shadow .12s ease, background .12s ease; }
    button:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(41, 116, 157, .12); }
    button.active { background: #1a83bd; color: white; box-shadow: 0 12px 30px rgba(26, 131, 189, .23); }
    .notes { margin-top: 22px; padding: 18px; border-radius: 18px; background: rgba(255,255,255,.58); border: 1px solid rgba(37,111,154,.1); font-size: 14px; line-height: 1.7; color: #58738b; }
    .notes strong { color: #254d6b; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; padding: 16px; } .stage { min-height: 430px; } .panel { padding: 0 4px 20px; } }
  </style>
</head>
<body>
  <main>
    <section class="stage"><div class="mount" id="mount" aria-label="Plain Slime animation preview"></div></section>
    <section class="panel">
      <h1>Plain Slime</h1>
      <p class="lede">Riveへ移す前のmotion reference。素体の可愛さ、squash / stretch、顔の追従、敗北時の×目を確認します。</p>
      <div class="controls" id="controls">
        <button data-motion="idle" class="active">Idle</button>
        <button data-motion="bounce">Move / Bounce</button>
        <button data-motion="attack">Body Bump</button>
        <button data-motion="hit">Hit</button>
        <button data-motion="celebrate">Celebrate</button>
        <button data-motion="defeat">Defeat</button>
      </div>
      <div class="notes">
        <strong>Rive mapping</strong><br>
        BodyRoot = main squash/stretch<br>
        FaceRoot = delayed secondary motion<br>
        HighlightRoot = subtle counter-drift<br>
        Shadow = contact / airborne cue<br>
        NormalEyes ↔ DefeatEyes = state swap
      </div>
    </section>
  </main>
  <script>
    const mount = document.querySelector('#mount');
    const controls = document.querySelector('#controls');
    let raf = 0;
    let startedAt = performance.now();
    const requestedMotion = new URLSearchParams(location.search).get('motion');
    const knownMotions = new Set(['idle','bounce','attack','hit','celebrate','defeat']);
    let motion = knownMotions.has(requestedMotion) ? requestedMotion : 'idle';

    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const easeOutBack = (t, s = 1.35) => { const x = t - 1; return 1 + (s + 1) * x * x * x + s * x * x; };
    const easeInOut = (t) => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
    const lerp = (a,b,t) => a + (b-a)*t;
    const seg = (t,a,b) => clamp01((t-a)/(b-a));

    function applyTransform(el, {x=0,y=0,sx=1,sy=1,r=0,ox=256,oy=390}={}) {
      el.setAttribute('transform', `translate(${x} ${y}) translate(${ox} ${oy}) rotate(${r}) scale(${sx} ${sy}) translate(${-ox} ${-oy})`);
    }

    function reset(svg) {
      ['BodyRoot','FaceRoot','HighlightRoot'].forEach(id => applyTransform(svg.getElementById(id)));
      applyTransform(svg.getElementById('Shadow'), {ox:256, oy:407});
      svg.getElementById('NormalEyes').setAttribute('opacity','1');
      svg.getElementById('DefeatEyes').setAttribute('opacity','0');
      svg.getElementById('Mouth').setAttribute('opacity','1');
      svg.getElementById('BlushLeft').setAttribute('opacity','.38');
      svg.getElementById('BlushRight').setAttribute('opacity','.38');
    }

    function animate(now) {
      const svg = mount.querySelector('svg');
      if (!svg) return;
      const body = svg.getElementById('BodyRoot');
      const face = svg.getElementById('FaceRoot');
      const highlight = svg.getElementById('HighlightRoot');
      const shadow = svg.getElementById('Shadow');
      const normalEyes = svg.getElementById('NormalEyes');
      const defeatEyes = svg.getElementById('DefeatEyes');
      const mouth = svg.getElementById('Mouth');
      const blushL = svg.getElementById('BlushLeft');
      const blushR = svg.getElementById('BlushRight');
      const elapsed = (now - startedAt) / 1000;
      reset(svg);

      if (motion === 'idle') {
        const p = (elapsed % 2.6) / 2.6;
        const breathe = Math.sin(p * Math.PI * 2);
        const sway = Math.sin(p * Math.PI * 2 + .55);
        applyTransform(body, {x:sway*3.5, y:-breathe*2.6, sx:1 + breathe*.012, sy:1 - breathe*.010, r:sway*.65});
        applyTransform(face, {x:sway*4.6, y:-breathe*1.8, r:sway*.9, oy:280});
        applyTransform(highlight, {x:-sway*1.7, y:-breathe*2.3, r:-sway*.3, oy:190});
        applyTransform(shadow, {sx:1 - breathe*.018, sy:1 + breathe*.006, ox:256, oy:407});
      }

      if (motion === 'bounce') {
        const p = (elapsed % .82) / .82;
        let y=0,sx=1,sy=1;
        if (p < .18) { const q=easeInOut(seg(p,0,.18)); sx=lerp(1,1.12,q); sy=lerp(1,.86,q); y=lerp(0,8,q); }
        else if (p < .46) { const q=easeOutBack(seg(p,.18,.46),.7); sx=lerp(1.12,.93,q); sy=lerp(.86,1.08,q); y=lerp(8,-43,q); }
        else if (p < .72) { const q=easeInOut(seg(p,.46,.72)); sx=lerp(.93,1.07,q); sy=lerp(1.08,.9,q); y=lerp(-43,7,q); }
        else { const q=easeOutBack(seg(p,.72,1),1); sx=lerp(1.07,1,q); sy=lerp(.9,1,q); y=lerp(7,0,q); }
        applyTransform(body,{y,sx,sy});
        applyTransform(face,{y:y*.88,sx:1 + (sx-1)*.45,sy:1 + (sy-1)*.35,oy:280});
        applyTransform(highlight,{y:y*.94,sx:1 + (sx-1)*.6,sy:1 + (sy-1)*.6,oy:190});
        const air=clamp01(-y/43); applyTransform(shadow,{sx:1-air*.27,sy:1-air*.08,ox:256,oy:407}); shadow.setAttribute('opacity', String(.16-air*.07));
      }

      if (motion === 'attack') {
        const p = (elapsed % 1.4) / 1.4;
        let x=0,y=0,sx=1,sy=1,r=0;
        if (p < .11) { const q=easeInOut(seg(p,0,.11)); x=lerp(0,-9,q); sx=lerp(1,1.15,q); sy=lerp(1,.84,q); y=lerp(0,7,q); r=lerp(0,-3,q); }
        else if (p < .22) { const q=easeOutBack(seg(p,.11,.22),.3); x=lerp(-9,55,q); sx=lerp(1.15,.89,q); sy=lerp(.84,1.11,q); y=lerp(7,-16,q); r=lerp(-3,7,q); }
        else if (p < .30) { const q=easeInOut(seg(p,.22,.30)); x=lerp(55,69,q); sx=lerp(.89,1.12,q); sy=lerp(1.11,.91,q); y=lerp(-16,-4,q); r=lerp(7,9,q); }
        else if (p < .42) { const q=easeOutBack(seg(p,.30,.42),.9); x=lerp(69,24,q); sx=lerp(1.12,.95,q); sy=lerp(.91,1.05,q); y=lerp(-4,-7,q); r=lerp(9,-2,q); }
        else if (p < .58) { const q=easeOutBack(seg(p,.42,.58),1.1); x=lerp(24,0,q); sx=lerp(.95,1,q); sy=lerp(1.05,1,q); y=lerp(-7,0,q); r=lerp(-2,0,q); }
        applyTransform(body,{x,y,sx,sy,r});
        applyTransform(face,{x:x*.83,y:y*.72,r:r*.55,oy:280});
        applyTransform(highlight,{x:x*.76,y:y*.88,r:r*.3,oy:190});
        applyTransform(shadow,{x:x*.65,sx:1 + (sx-1)*.5,ox:256,oy:407});
      }

      if (motion === 'hit') {
        const p=(elapsed%.9)/.9; let x=0,sx=1,sy=1,r=0;
        if(p<.12){const q=easeInOut(seg(p,0,.12));x=lerp(0,-29,q);sx=lerp(1,1.13,q);sy=lerp(1,.88,q);r=lerp(0,-6,q)}
        else if(p<.28){const q=easeOutBack(seg(p,.12,.28),1.25);x=lerp(-29,9,q);sx=lerp(1.13,.95,q);sy=lerp(.88,1.06,q);r=lerp(-6,2,q)}
        else if(p<.48){const q=easeOutBack(seg(p,.28,.48),1.15);x=lerp(9,0,q);sx=lerp(.95,1,q);sy=lerp(1.06,1,q);r=lerp(2,0,q)}
        applyTransform(body,{x,sx,sy,r}); applyTransform(face,{x:x*.76,r:r*.7,oy:280}); applyTransform(highlight,{x:x*.56,r:r*.3,oy:190});
      }

      if (motion === 'celebrate') {
        const p=(elapsed%1.3)/1.3; let y=0,sx=1,sy=1,r=0;
        if(p<.16){const q=easeInOut(seg(p,0,.16));sx=lerp(1,1.1,q);sy=lerp(1,.88,q);y=lerp(0,7,q)}
        else if(p<.38){const q=easeOutBack(seg(p,.16,.38),.55);sx=lerp(1.1,.92,q);sy=lerp(.88,1.1,q);y=lerp(7,-55,q);r=lerp(0,-5,q)}
        else if(p<.61){const q=easeInOut(seg(p,.38,.61));y=lerp(-55,8,q);r=lerp(-5,5,q);sx=lerp(.92,1.08,q);sy=lerp(1.1,.9,q)}
        else if(p<.8){const q=easeOutBack(seg(p,.61,.8),1.2);y=lerp(8,0,q);r=lerp(5,0,q);sx=lerp(1.08,1,q);sy=lerp(.9,1,q)}
        applyTransform(body,{y,sx,sy,r}); applyTransform(face,{y:y*.82,r:r*.6,oy:280}); applyTransform(highlight,{y:y*.9,r:r*.3,oy:190});
        const air=clamp01(-y/55); applyTransform(shadow,{sx:1-air*.3,sy:1-air*.1,ox:256,oy:407});
      }

      if (motion === 'defeat') {
        const p=Math.min(1,elapsed/1.25); let y=0,sx=1,sy=1,r=0;
        if(p<.18){const q=easeInOut(seg(p,0,.18));y=lerp(0,-18,q);sx=lerp(1,.94,q);sy=lerp(1,1.09,q);r=lerp(0,-4,q)}
        else if(p<.52){const q=easeInOut(seg(p,.18,.52));y=lerp(-18,52,q);sx=lerp(.94,1.38,q);sy=lerp(1.09,.46,q);r=lerp(-4,2,q)}
        else {const q=easeOutBack(seg(p,.52,1),.45);y=lerp(52,49,q);sx=lerp(1.38,1.34,q);sy=lerp(.46,.5,q);r=lerp(2,0,q)}
        applyTransform(body,{y,sx,sy,r,oy:395}); applyTransform(face,{y:y*.72,sx:1+(sx-1)*.68,sy:1+(sy-1)*.5,oy:310}); applyTransform(highlight,{y:y*.85,sx:1+(sx-1)*.6,sy:1+(sy-1)*.6,oy:210});
        const eyeQ=easeInOut(seg(p,.34,.5)); normalEyes.setAttribute('opacity',String(1-eyeQ)); defeatEyes.setAttribute('opacity',String(eyeQ)); mouth.setAttribute('opacity',String(1-eyeQ)); blushL.setAttribute('opacity',String(.38*(1-eyeQ))); blushR.setAttribute('opacity',String(.38*(1-eyeQ)));
        applyTransform(shadow,{sx:lerp(1,1.36,clamp01(p/.55)),sy:lerp(1,.75,clamp01(p/.55)),ox:256,oy:407});
      }

      raf=requestAnimationFrame(animate);
    }

    fetch('./plain-slime.svg')
      .then(r => r.text())
      .then(markup => {
        mount.innerHTML = markup;
        controls.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.motion === motion));
        startedAt = performance.now();
        raf=requestAnimationFrame(animate);
      });

    controls.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-motion]');
      if (!button) return;
      motion = button.dataset.motion;
      startedAt = performance.now();
      controls.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === button));
    });
  </script>
</body>
</html>

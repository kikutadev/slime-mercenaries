<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b9e988" />
    <meta
      name="description"
      content="Slime Mercenaries — Blender Python generated Sword Slime combat prototype."
    />
    <title>Slime Mercenaries — Sword Slime Combat PoC</title>
  </head>
  <body>
    <main class="page">
      <section class="game-shell" aria-label="Slime Mercenaries Sword Slime combat prototype">
        <canvas id="game-canvas"></canvas>

        <header class="hud hud--top">
          <div>
            <p class="eyebrow">CLOVER ROAD · COMBAT POC</p>
            <h1>Sword Slime</h1>
          </div>
          <div class="status-chip" aria-label="runtime status">
            <span class="status-dot"></span>
            Blender GLB
          </div>
        </header>

        <div class="hint" id="hint">スライムをタップすると体当たりします</div>

        <footer class="hud hud--bottom">
          <div class="unit-card">
            <div class="unit-icon" aria-hidden="true">◆</div>
            <div>
              <strong>Sword Slime</strong>
              <span>Gravity · Tackle · Sword follow-through</span>
            </div>
          </div>

          <div class="controls" role="group" aria-label="Slime animation controls">
            <button type="button" data-action="idle" class="control is-active">Idle</button>
            <button type="button" data-action="hop" class="control">Hop</button>
            <button type="button" data-action="tackle" class="control">Tackle</button>
            <button type="button" data-action="slash" class="control">Slash</button>
          </div>
        </footer>

        <div class="loading" id="loading" role="status" aria-live="polite">
          <div class="loading-blob"></div>
          <span>Forging slime...</span>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
